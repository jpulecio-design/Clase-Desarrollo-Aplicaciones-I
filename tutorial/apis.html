    <section class="container my-4">
        <h1>Nager.Date API - Días Festivos</h1>
        <p class="lead">Consulta los días festivos públicos de más de 100 países.</p>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label">País</label>
                <select id="selectPais" class="form-select">
                    <option value="CO">Colombia</option>
                    <option value="US">Estados Unidos</option>
                    <option value="ES">España</option>
                    <option value="MX">México</option>
                    <option value="AR">Argentina</option>
                    <option value="DE">Alemania</option>
                    <option value="FR">Francia</option>
                    <option value="JP">Japón</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Año</label>
                <input type="number" id="inputAnio" class="form-control" value="2026" min="2020" max="2030">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button id="btnConsultar" class="btn btn-primary w-100">Consultar Festivos</button>
            </div>
        </div>

        <div id="resultado" class="row g-3">
            <em class="text-muted">Selecciona un país y un año, luego presiona Consultar...</em>
        </div>
    </section>

    <script>
        const API_URL = 'https://date.nager.at/api/v3';
        const resultado = document.getElementById('resultado');

        // Nombres de meses en español
        const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
            'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

        // Formatear fecha YYYY-MM-DD a "DD de Mes de YYYY"
        function formatearFecha(fechaStr) {
            const [año, mes, dia] = fechaStr.split('-');
            return `${parseInt(dia)} de ${meses[parseInt(mes) - 1]} de ${año}`;
        }

        // Traducir tipo de festivo
        function traducirTipo(tipos) {
            const mapa = {
                'Public': 'Público',
                'Bank': 'Bancario',
                'School': 'Escolar',
                'Authorities': 'Autoridades',
                'Optional': 'Opcional',
                'Observance': 'Conmemorativo'
            };
            return tipos.map(t => mapa[t] || t).join(', ');
        }

        async function consultarFestivos() {
            const pais = document.getElementById('selectPais').value;
            const anio = document.getElementById('inputAnio').value;

            resultado.innerHTML = '<p>Cargando festivos...</p>';

            try {
                const resp = await fetch(`${API_URL}/PublicHolidays/${anio}/${pais}`);
                if (!resp.ok) throw new Error('Error HTTP: ' + resp.status);

                const festivos = await resp.json();

                if (!festivos || festivos.length === 0) {
                    resultado.innerHTML = '<p class="text-muted">No se encontraron festivos para esta selección.</p>';
                    return;
                }

                // Ordenar por fecha
                festivos.sort((a, b) => new Date(a.date) - new Date(b.date));

                // Construir las tarjetas
                let html = '';
                festivos.forEach(festivo => {
                    const esNacional = festivo.global ? '🌍 Nacional' : '📍 Regional';
                    const esFijo = festivo.fixed ? '📌 Fijo' : '🔄 Móvil';

                    html += `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-start border-4 border-primary">
                            <div class="card-body">
                                <h5 class="card-title">${festivo.localName}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${festivo.name}</h6>
                                <p class="card-text mb-1">
                                    <strong>📅 ${formatearFecha(festivo.date)}</strong>
                                </p>
                                <p class="card-text small text-muted mb-0">
                                    ${esNacional} · ${esFijo}
                                </p>
                                <p class="card-text small text-muted">
                                    <span class="badge bg-secondary">${traducirTipo(festivo.types || [])}</span>
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                });
                resultado.innerHTML = html;

            } catch (error) {
                resultado.innerHTML = `<p class="text-danger">❌ Error: ${error.message}</p>`;
            }
        }

        // Eventos
        document.getElementById('btnConsultar').addEventListener('click', consultarFestivos);
    </script>
